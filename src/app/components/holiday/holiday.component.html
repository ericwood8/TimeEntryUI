<main class="main">
    <div class="content">
      <div class="left-side">
<div>
    <!-- Heading -->
    <h1>Holidays</h1>
    <button (click)="add()" class="btn">Add New Holiday</button>

    <!-- Search -->
    <div class="form-group form-group-search dept">
        <input type="text" class="form-control" placeholder="Search by Name" [(ngModel)]="searchText" />
        <button class="btn btn-outline-secondary" type="button" (click)="search()"> Search </button>
    </div>

    <!-- Grid -->
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Iso Country Alpha3 Code</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let holiday of rows">
                <td>{{ holiday.name }}</td>
                <td>{{ holiday.sY_IsoCountry_Alpha3Code }}</td>
                <td>{{ holiday.date | date:'MM/dd/yyyy' }}</td>
                <td>
                    <button (click)="edit(holiday)" class="btn-action">Edit</button>
                    <button (click)="delete(holiday.holidayId!)" class="btn-action delete">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Add/Edit Form -->
    <div *ngIf="selectedRow" class="form-container">
        <h2>{{selectedRow.holidayId ? 'Edit' : 'Add'}} Holiday</h2>
        <form id="holidayForm" (ngSubmit)="submit(selectedRow)">
            <div class="form-group">
                <label for="holidayName">Name</label>
                <input type="text" id="holidayName" name="holidayName" [(ngModel)]="selectedRow.name" maxlength="50" placeholder="Enter name" required>
            </div>
            <div class="form-group">
                <label for="holidaySY_IsoCountry_Alpha3Code">Iso Country Alpha3 Code</label>
                <input type="text" id="holidaySY_IsoCountry_Alpha3Code" name="holidaySY_IsoCountry_Alpha3Code" [(ngModel)]="selectedRow.sY_IsoCountry_Alpha3Code" maxlength="3" placeholder="Enter iso country alpha3 code" required>
            </div>
            <div class="form-group">
                <label for="holidayDate">Date</label>
                <input type="date" id="holidayDate" name="holidayDate" [(ngModel)]="selectedRow.date" required>
            </div>

            <button type="submit" class="btn">Submit</button>
            <button type="button" (click)="cancel()" class="btn btn-outline">Cancel</button>
        </form>
    </div>
</div>
</div>
</div>
</main>
